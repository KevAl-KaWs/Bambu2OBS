name: Build Windows .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --name Bambu2OBS --paths src --hidden-import progressbarServer --add-data "src/templates;templates" src/bambu2obs.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke | Out-Null
          Copy-Item dist/Bambu2OBS.exe smoke/
          "PRINTER_IP=192.0.2.1`nACCESS_CODE=x`nPRINTER_SN=x`nBASE_DIR=data" | Set-Content smoke/.env
          $proc = Start-Process -FilePath smoke/Bambu2OBS.exe -WorkingDirectory smoke -PassThru
          Start-Sleep -Seconds 15
          $status = Invoke-WebRequest -UseBasicParsing http://localhost:5000/status
          $overlay = Invoke-WebRequest -UseBasicParsing http://localhost:5000/view/overlay
          $script = Invoke-WebRequest -UseBasicParsing http://localhost:5000/view/overlay.js
          Write-Host $status.Content
          Stop-Process -Id $proc.Id -Force
          if ($overlay.StatusCode -ne 200 -or $script.StatusCode -ne 200) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/Bambu2OBS.exe release/
          Copy-Item ANLEITUNG.md release/ANLEITUNG.txt
          Compress-Archive -Path release/* -DestinationPath Bambu2OBS-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Bambu2OBS-Windows
          path: Bambu2OBS-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bambu2OBS-Windows.zip
