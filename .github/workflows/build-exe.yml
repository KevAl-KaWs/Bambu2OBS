name: Build Windows .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create icon
        run: python -c "import sys; sys.path.insert(0, 'src'); from tray import create_icon_image; create_icon_image(256).save('icon.ico', sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"

      - name: Build exe
        run: pyinstaller --onefile --noconsole --icon icon.ico --name Bambu2OBS --paths src --hidden-import progressbarServer --hidden-import tray --hidden-import pystray._win32 --add-data "src/templates;templates" src/bambu2obs.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke | Out-Null
          Copy-Item dist/Bambu2OBS.exe smoke/
          "PRINTER_IP=192.0.2.1`nACCESS_CODE=x`nPRINTER_SN=x`nBASE_DIR=data" | Set-Content smoke/.env
          $proc = Start-Process -FilePath smoke/Bambu2OBS.exe -WorkingDirectory smoke -PassThru
          Start-Sleep -Seconds 15
          $status = Invoke-WebRequest -UseBasicParsing http://localhost:5000/status
          $overlay = Invoke-WebRequest -UseBasicParsing http://localhost:5000/view/overlay
          $script = Invoke-WebRequest -UseBasicParsing http://localhost:5000/view/overlay.js
          $settings = Invoke-WebRequest -UseBasicParsing http://localhost:5000/
          $api = Invoke-WebRequest -UseBasicParsing http://localhost:5000/api/settings
          Write-Host $api.Content
          Write-Host $status.Content
          # Second start must not start a second server, just open the settings and exit
          $second = Start-Process -FilePath smoke/Bambu2OBS.exe -WorkingDirectory smoke -PassThru
          if (-not $second.WaitForExit(15000)) { Write-Host "second instance did not exit"; exit 1 }
          if ($proc.HasExited) { Write-Host "tray app exited unexpectedly"; exit 1 }
          Get-Content "$env:APPDATA/Bambu2OBS/bambu2obs.log"
          if (Select-String -Path "$env:APPDATA/Bambu2OBS/bambu2obs.log" -Pattern "Tray icon (not available|failed)" -Quiet) { Write-Host "tray icon failed"; exit 1 }
          Stop-Process -Id $proc.Id -Force
          if ($overlay.StatusCode -ne 200 -or $script.StatusCode -ne 200 -or $settings.StatusCode -ne 200 -or -not $api.Content.Contains('192.0.2.1')) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/Bambu2OBS.exe release/
          Copy-Item ANLEITUNG.md release/ANLEITUNG.txt
          Compress-Archive -Path release/* -DestinationPath Bambu2OBS-Windows-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Bambu2OBS-Windows
          path: Bambu2OBS-Windows-${{ github.ref_name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bambu2OBS-Windows-${{ github.ref_name }}.zip
